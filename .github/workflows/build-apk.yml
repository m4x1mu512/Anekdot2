name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Тип сборки APK'
        required: true
        default: 'both'
        type: choice
        options:
          - debug
          - release
          - both
      run_tests:
        description: 'Запускать модульные тесты перед сборкой'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-apk:
    name: Сборка APK (АнекдотПоиск)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Установка JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Настройка Android SDK и принятие лицензий
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

          SDKMANAGER=""
          if [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            SDKMANAGER="$(find "$SDK_DIR" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          fi

          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null || true
          fi

      - name: Установка и кэширование Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          validate-wrappers: false

      - name: Подготовка .env и ключей подписи (Debug и Release)
        env:
          SECRET_KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 --decode debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          KEYSTORE_FILE="$RUNNER_TEMP/release-upload-key.jks"
          rm -f "$KEYSTORE_FILE"
          if [ -n "$SECRET_KEYSTORE_B64" ] && [ -n "$SECRET_STORE_PASSWORD" ] && [ -n "$SECRET_KEY_PASSWORD" ]; then
            echo "Используется релизный ключ из GitHub Secrets..."
            echo "$SECRET_KEYSTORE_B64" | base64 --decode > "$KEYSTORE_FILE"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$SECRET_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$SECRET_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "GitHub Secrets не заданы — создаётся ключ подписи для Release APK..."
            TEMP_PASS="anekdot_ci_release_2026"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -storepass "$TEMP_PASS" \
              -alias upload \
              -keypass "$TEMP_PASS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=AnekdotPoisk,O=AIStudio,C=RU"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$TEMP_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$TEMP_PASS" >> "$GITHUB_ENV"
          fi

      - name: Запуск модульных тестов
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests == true }}
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Сборка Debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug' || inputs.build_type == 'both' }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Публикация артефакта Debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: AnekdotPoisk-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Сборка подписанного Release APK
        if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.build_type == 'release' || inputs.build_type == 'both') }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Публикация артефакта Release APK
        if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.build_type == 'release' || inputs.build_type == 'both') }}
        uses: actions/upload-artifact@v4
        with:
          name: AnekdotPoisk-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Отчёт о сборке в Summary
        run: |
          {
            echo "## Сборка APK завершена успешно"
            echo ""
            if ls app/build/outputs/apk/debug/*.apk >/dev/null 2>&1; then
              echo "- **Debug APK:** доступен в разделе **Artifacts -> AnekdotPoisk-debug-apk**"
            fi
            if ls app/build/outputs/apk/release/*.apk >/dev/null 2>&1; then
              echo "- **Release APK:** доступен в разделе **Artifacts -> AnekdotPoisk-release-apk**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Создание GitHub Release при отправке тега v*
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
